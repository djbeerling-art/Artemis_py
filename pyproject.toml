[project]
name = "artemis_p"
version = "0.0.1"
description = "Python port of ARTEMIS v1.1, a reactive transport enhanced-weathering model for soils"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["artemis_p"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
